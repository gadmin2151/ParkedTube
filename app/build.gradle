plugins {
    id "com.android.application"
    id "maven-publish"
}

def releaseKeystorePath = providers.environmentVariable("ANDROID_KEYSTORE_PATH").orNull
def releaseKeystorePassword = providers.environmentVariable("ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("ANDROID_KEY_PASSWORD").orNull
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace "dev.codex.aaparkedyoutube"
    compileSdk 35
    buildToolsVersion "35.0.0"

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "dev.codex.aaparkedyoutube"
        minSdk 28
        targetSdk 35
        versionCode providers.gradleProperty("PARKEDTUBE_VERSION_CODE").get().toInteger()
        versionName providers.gradleProperty("PARKEDTUBE_VERSION_NAME").get()
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease" && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                    "Release signing is not configured. Use scripts/build-apk.sh release."
            )
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            releaseApk(MavenPublication) {
                groupId = "dev.codex"
                artifactId = "parkedtube"
                version = providers.gradleProperty("PARKEDTUBE_VERSION_NAME").get()

                artifact(file("$buildDir/outputs/apk/release/app-release.apk")) {
                    extension = "apk"
                    builtBy(tasks.named("assembleRelease"))
                }

                pom {
                    name = "ParkedTube"
                    description = "Parked Android Auto YouTube viewer"
                    url = "https://github.com/gadmin2151/ParkedTube"
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/${System.getenv("GITHUB_REPOSITORY") ?: "gadmin2151/ParkedTube"}")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
